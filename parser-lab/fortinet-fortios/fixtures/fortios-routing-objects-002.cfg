! synthetic fixture
! no customer data
! purpose: FortiOS static routes, firewall address/service objects, policies, and NAT markers
! feature coverage tags: static-routes, interfaces, vlan-interface, zones, address-objects, service-objects, policy, ippool, nat-marker
config system global
    set hostname "fg-baseline-002"
    set admintimeout 10
end
config system interface
    edit "port3"
        set vdom "root"
        set alias "dmz-edge"
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping ssh
        set role wan
    next
    edit "port4"
        set vdom "root"
        set alias "server-trunk"
        set allowaccess ping https
        set role lan
    next
    edit "VLAN20"
        set vdom "root"
        set interface "port4"
        set vlanid 20
        set alias "app-vlan"
        set ip 192.0.2.20 255.255.255.0
        set role lan
    next
    edit "VLAN30"
        set vdom "root"
        set interface "port4"
        set vlanid 30
        set alias "db-vlan"
        set ip 192.0.2.30 255.255.255.0
        set role lan
    next
end
config system zone
    edit "DMZ"
        set interface "port3"
    next
    edit "SERVERS"
        set interface "VLAN20" "VLAN30"
    next
end
config firewall address
    edit "APP-SERVER"
        set subnet 192.0.2.20 255.255.255.255
    next
    edit "DB-SERVER"
        set subnet 192.0.2.30 255.255.255.255
    next
    edit "MGMT-NET"
        set subnet 192.0.2.0 255.255.255.0
    next
end
config firewall service custom
    edit "HTTPS-MGMT"
        set tcp-portrange 443
    next
    edit "MYSQL"
        set tcp-portrange 3306
    next
    edit "RDP-ADMIN"
        set tcp-portrange 3389
    next
end
config firewall ippool
    edit "SNAT-POOL-002"
        set type overload
        set startip 203.0.113.100
        set endip 203.0.113.110
    next
end
config firewall policy
    edit 10
        set name "servers-to-internet"
        set srcintf "SERVERS"
        set dstintf "DMZ"
        set srcaddr "APP-SERVER" "DB-SERVER"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS-MGMT" "MYSQL"
        set nat enable
        set ippool enable
        set poolname "SNAT-POOL-002"
        set logtraffic all
    next
    edit 11
        set name "mgmt-to-servers"
        set srcintf "DMZ"
        set dstintf "SERVERS"
        set srcaddr "MGMT-NET"
        set dstaddr "APP-SERVER" "DB-SERVER"
        set action accept
        set schedule "always"
        set service "RDP-ADMIN"
        set logtraffic all
    next
end
config router static
    edit 1
        set dst 0.0.0.0/0
        set gateway 203.0.113.1
        set device "port3"
    next
    edit 2
        set dst 192.0.2.0/24
        set gateway 192.0.2.1
        set device "VLAN20"
        set distance 10
    next
end
# note-only: future vpn area reserved for route-based and policy-based ipsec.
# note-only: future sdwan area reserved for members and health-checks.

