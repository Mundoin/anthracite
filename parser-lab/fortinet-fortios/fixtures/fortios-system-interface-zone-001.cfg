! synthetic fixture
! no customer data
! purpose: FortiOS baseline for system/global, interfaces, VLANs, zones, address/service objects, policies, NAT markers, and note-only VPN/SD-WAN hints
! feature coverage tags: system-global, interfaces, vlan-interface, zones, address-objects, service-objects, policy, nat-marker, vpn-note, sdwan-note
config system global
    set hostname "fg-baseline-001"
    set admintimeout 15
    set gui-theme mariner
end
config system interface
    edit "port1"
        set vdom "root"
        set alias "wan-uplink"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping https ssh
        set role wan
        set mtu-override enable
        set mtu 1500
    next
    edit "port2"
        set vdom "root"
        set alias "lan-trunk"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https
        set role lan
    next
    edit "VLAN10"
        set vdom "root"
        set interface "port2"
        set vlanid 10
        set alias "users-vlan"
        set ip 192.0.2.10 255.255.255.0
        set role lan
    next
end
config system zone
    edit "LAN"
        set interface "port2" "VLAN10"
    next
    edit "WAN"
        set interface "port1"
    next
end
config firewall address
    edit "LAN_NET"
        set subnet 192.0.2.0 255.255.255.0
    next
    edit "WAN_PEER"
        set subnet 198.51.100.1 255.255.255.255
    next
end
config firewall service custom
    edit "HTTPS-ADMIN"
        set tcp-portrange 443
    next
    edit "DNS-CLIENT"
        set udp-portrange 53
    next
end
config firewall policy
    edit 1
        set name "lan-to-wan"
        set srcintf "LAN"
        set dstintf "WAN"
        set srcaddr "LAN_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS-ADMIN" "DNS-CLIENT"
        set nat enable
        set logtraffic all
    next
end
config router static
    edit 1
        set dst 0.0.0.0/0
        set gateway 198.51.100.1
        set device "port1"
    next
end
# note-only: future vpn coverage would include config vpn ipsec phase1-interface / phase2-interface.
# note-only: future sdwan coverage would include config system sdwan members / health-check.

