! synthetic fixture
! no customer data
! purpose: FortiOS L2/L3 variation with note-only VPN and SD-WAN hints
! feature coverage tags: system-global, interfaces, vlan-interface, zones, address-objects, service-objects, policy, static-routes, nat-marker, vpn-note, sdwan-note
config system global
    set hostname "fg-baseline-003"
    set admintimeout 20
    set timezone 04
end
config system interface
    edit "port5"
        set vdom "root"
        set alias "lan-trunk"
        set allowaccess ping https
        set role lan
    next
    edit "port6"
        set vdom "root"
        set alias "wan-uplink"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping ssh
        set role wan
    next
    edit "VLAN100"
        set vdom "root"
        set interface "port5"
        set vlanid 100
        set alias "guest-vlan"
        set ip 192.0.2.100 255.255.255.0
        set role lan
    next
    edit "VLAN200"
        set vdom "root"
        set interface "port5"
        set vlanid 200
        set alias "iot-vlan"
        set ip 192.0.2.200 255.255.255.0
        set role lan
    next
end
config system zone
    edit "GUEST"
        set interface "VLAN100"
    next
    edit "IOT"
        set interface "VLAN200"
    next
    edit "WAN"
        set interface "port6"
    next
end
config firewall address
    edit "GUEST_NET"
        set subnet 192.0.2.0 255.255.255.0
    next
    edit "IOT_NET"
        set subnet 192.0.2.200 255.255.255.0
    next
    edit "MGMT_HOST"
        set subnet 198.51.100.50 255.255.255.255
    next
end
config firewall service custom
    edit "WEB-ALT"
        set tcp-portrange 8080-8081
    next
    edit "MGMT-HTTPS"
        set tcp-portrange 8443
    next
end
config firewall ippool
    edit "SNAT-POOL-003"
        set type overload
        set startip 198.51.100.120
        set endip 198.51.100.130
    next
end
config firewall policy
    edit 20
        set name "guest-to-internet"
        set srcintf "GUEST"
        set dstintf "WAN"
        set srcaddr "GUEST_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "WEB-ALT"
        set nat enable
        set ippool enable
        set poolname "SNAT-POOL-003"
        set logtraffic all
    next
    edit 21
        set name "iot-to-mgmt"
        set srcintf "IOT"
        set dstintf "WAN"
        set srcaddr "IOT_NET"
        set dstaddr "MGMT_HOST"
        set action accept
        set schedule "always"
        set service "MGMT-HTTPS"
        set logtraffic all
    next
end
config router static
    edit 1
        set dst 0.0.0.0/0
        set gateway 198.51.100.1
        set device "port6"
    next
    edit 2
        set dst 198.51.100.0/24
        set gateway 198.51.100.1
        set device "port6"
        set distance 5
    next
end
# note-only: future vpn coverage would add config vpn ipsec phase1-interface and phase2-interface.
# note-only: future sdwan coverage would add config system sdwan members, health-check, and service definitions.

