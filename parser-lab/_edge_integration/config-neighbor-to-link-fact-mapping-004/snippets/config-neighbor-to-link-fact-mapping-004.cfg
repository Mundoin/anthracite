! === cfg-neighbor-iosxe-001 | vendor=Cisco | platform=IOS-XE ===
hostname cfg-neighbor-iosxe-001
interface Loopback0
 ip address 192.0.2.30 255.255.255.255
interface GigabitEthernet0/0/0
 description peer-spine-a
 ip address 10.0.0.1 255.255.255.252
 no shutdown
router bgp 65001
 bgp router-id 192.0.2.30
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 description peer-spine-a
 address-family ipv4
  neighbor 10.0.0.2 activate
