# synthetic fixture
# no customer data
# purpose: RouterOS VLAN, bridge, access/trunk, and routed edge parser prep
# feature coverage tags: bridge-vlan-filtering, access, trunk, pvid, tagged-untagged, vlan-interface, routed-interface, static-route
/system identity set name=ros-l2-002
/interface bridge add name=br-core vlan-filtering=yes
/interface ethernet set [ find default-name=ether1 ] name=trunk1
/interface ethernet set [ find default-name=ether2 ] name=access1
/interface ethernet set [ find default-name=ether3 ] name=access2
/interface bridge port add bridge=br-core interface=trunk1 frame-types=admit-only-vlan-tagged ingress-filtering=yes
/interface bridge port add bridge=br-core interface=access1 pvid=10
/interface bridge port add bridge=br-core interface=access2 pvid=20
/interface bridge vlan add bridge=br-core tagged=br-core,trunk1 vlan-ids=10,20,30
/interface bridge vlan add bridge=br-core untagged=access1 vlan-ids=10
/interface bridge vlan add bridge=br-core untagged=access2 vlan-ids=20
/interface vlan add name=vlan30 interface=br-core vlan-id=30
/ip address add address=192.0.2.30/24 interface=vlan30
/ip address add address=198.51.100.2/30 interface=trunk1
/ip route add dst-address=0.0.0.0/0 gateway=198.51.100.1
/ip service set ssh disabled=no
/snmp set enabled=yes
