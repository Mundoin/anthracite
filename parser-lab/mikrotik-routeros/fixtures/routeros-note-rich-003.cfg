/interface ethernet set [ find default-name=ether2 ] name=lan
/interface vlan add name=vlan50 interface=br-edge vlan-id=50
/ip address add address=198.51.100.6/30 interface=wan
/ip address add address=192.0.2.6/24 interface=br-edge
/ip address add address=192.0.2.50/24 interface=vlan50
/ip route add dst-address=0.0.0.0/0 gateway=198.51.100.5
/ip route add dst-address=203.0.113.0/24 gateway=198.51.100.5 distance=20
/ip service set ssh disabled=no port=22
/snmp set enabled=yes
/system ntp client set enabled=yes
