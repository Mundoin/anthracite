! synthetic fixture
! no customer data
! purpose: Huawei VRP VLAN/SVI/trunk/access edge cases and syntax variations
! feature coverage tags: vlanif, access, trunk, vlan ranges, routed-interface-edge, subinterface-note, note-only acl/nat/qos/aaa
system-view
sysname VRP-EDGE-002
#
vlan batch 100 110 120 200 210
#
interface GigabitEthernet0/0/4
 description l2-access-voice
 port link-type access
 port default vlan 100
 stp edged-port enable
 undo shutdown
#
interface GigabitEthernet0/0/5
 description l2-trunk-range
 port link-type trunk
 port trunk allow-pass vlan 100 110 120 to 130 200 210
 port trunk pvid vlan 210
 undo shutdown
#
interface GigabitEthernet0/0/6
 description routed-edge
 undo portswitch
 ip address 203.0.113.2 255.255.255.252
 undo shutdown
#
interface GigabitEthernet0/0/7.100
 description dot1q-subinterface-note
 dot1q termination vid 100
 arp broadcast enable
 ip address 192.0.2.100 255.255.255.0
 undo shutdown
#
interface Vlanif100
 description guest-svi
 ip address 192.0.2.110 255.255.255.0
 shutdown
#
interface Vlanif210
 description services-svi
 ip address 192.0.2.210 255.255.255.0
 undo shutdown
#
ip route-static 0.0.0.0 0.0.0.0 203.0.113.1
ip route-static 192.0.2.0 255.255.255.0 192.0.2.1
#
# note-only: future ACL coverage would include numbered and named ACLs.
# note-only: future NAT coverage would include easy-ip and outbound NAT.
# note-only: future QoS coverage would include classifier/behavior/policy.
# note-only: future AAA coverage would include radius-server and local-user.
return

