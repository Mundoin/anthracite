! synthetic fixture
! no customer data
! purpose: Huawei VRP baseline for system/interface basics, VLANs, SVI, L2 trunk/access, and static routes
! feature coverage tags: system, interface basics, vlanif, access, trunk, static-route, stp-hint, note-only acl/nat/qos/aaa
system-view
sysname VRP-BASE-001
#
vlan batch 10 20 30 99
#
interface GigabitEthernet0/0/1
 description WAN uplink
 ip address 198.51.100.2 255.255.255.252
 undo shutdown
#
interface GigabitEthernet0/0/2
 description access-users
 port link-type access
 port default vlan 10
 stp edged-port enable
 undo shutdown
#
interface GigabitEthernet0/0/3
 description trunk-to-distribution
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 99
 port trunk pvid vlan 99
 undo shutdown
#
interface Vlanif10
 description users-svi
 ip address 192.0.2.10 255.255.255.0
 undo shutdown
#
interface Vlanif20
 description voice-svi
 ip address 192.0.2.20 255.255.255.0
 shutdown
#
interface Vlanif99
 description native-management-svi
 ip address 192.0.2.99 255.255.255.0
 undo shutdown
#
ip route-static 0.0.0.0 0.0.0.0 198.51.100.1
ip route-static 192.0.2.0 255.255.255.0 198.51.100.3 preference 10
#
# note-only: future ACL coverage would include acl number 3000 and rule entries.
# note-only: future NAT coverage would include nat outbound or nat server blocks.
# note-only: future QoS coverage would include traffic behavior / traffic policy blocks.
# note-only: future AAA coverage would include aaa, local-user, and authentication-scheme blocks.
return

