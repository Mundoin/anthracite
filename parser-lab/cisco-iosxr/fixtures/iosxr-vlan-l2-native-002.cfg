! synthetic fixture
! no customer data
! purpose: IOS-XR L2 subinterface and native VLAN parser prep
! feature coverage tags: l2transport, subinterface, dot1q, native-vlan, routed-interface, bvi, static-route, note-only markers
hostname xr-l2-002
!
interface GigabitEthernet0/0/0/2
 description trunk-parent
 no shutdown
!
interface GigabitEthernet0/0/0/2.100 l2transport
 encapsulation dot1q 100
 rewrite ingress tag pop 1 symmetric
!
interface GigabitEthernet0/0/0/2.200 l2transport
 encapsulation dot1q 200 native
 rewrite ingress tag pop 1 symmetric
!
interface GigabitEthernet0/0/0/3
 description access-routed-edge
 ipv4 address 192.0.2.30 255.255.255.0
 no shutdown
!
interface BVI100
 description users-bvi
 ipv4 address 192.0.2.100 255.255.255.0
 no shutdown
!
l2vpn
 bridge group BG1
  bridge-domain BD100
   interface GigabitEthernet0/0/0/2.100
   interface GigabitEthernet0/0/0/2.200
   routed interface BVI100
  !
 !
!
router static
 address-family ipv4 unicast
  192.0.2.0/24 198.51.100.1
 !
!
ssh server v2
snmp-server community public RO
