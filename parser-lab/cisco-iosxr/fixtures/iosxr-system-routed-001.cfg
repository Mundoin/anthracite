! synthetic fixture
! no customer data
! purpose: IOS-XR system identity, routed interfaces, and management-plane baseline
! feature coverage tags: hostname, routed-interface, loopback, ipv4, ipv6, static-route, management-plane, note-only markers
hostname xr-core-001
!
interface Loopback0
 description router-id loopback
 ipv4 address 192.0.2.1 255.255.255.255
 ipv6 address 2001:db8:1::1/128
!
interface GigabitEthernet0/0/0/0
 description wan-uplink
 ipv4 address 198.51.100.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description mgmt-uplink
 ipv4 address 203.0.113.2 255.255.255.252
 no shutdown
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 198.51.100.1
  203.0.113.0/24 203.0.113.1
 !
!
ssh server v2
netconf-yang agent ssh
snmp-server community public RO
ntp server vrf Mgmt-intf 192.0.2.53
logging host 192.0.2.60
username admin secret 5 $1$fake$hash
! note-only: acl markers would include route-policy and access-list family definitions.
! note-only: nat markers would include nat or interface translation blocks.
! note-only: qos markers would include class-map and policy-map objects.
! note-only: aaa markers would include aaa authentication and authorization blocks.
! note-only: security markers would include security zone/policy objects.
! note-only: routing markers would include ospf/bgp/isis process blocks.

