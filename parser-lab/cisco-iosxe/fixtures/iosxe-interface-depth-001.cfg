! synthetic fixture
! no customer data
! purpose: IOS-XE interface-depth parser prep
! feature coverage tags: hostname, loopback, routed physical interface, switchport access, switchport trunk, shutdown/no shutdown, description, ipv4, ipv6, mtu, speed, duplex
version 17.9
hostname iosxe-int-depth-001
!
interface Loopback0
 description parser-prep loopback
 ip address 192.0.2.10 255.255.255.255
 ipv6 address 2001:db8:0:10::10/128
 no shutdown
!
interface GigabitEthernet0/0/0
 description WAN uplink, primary carrier-A
 ip address 198.51.100.2 255.255.255.252
 ipv6 address 2001:db8:0:1::2/64
 mtu 1500
 speed 1000
 duplex full
 no shutdown
!
interface GigabitEthernet0/0/1
 description access-port for lab users
 switchport mode access
 switchport access vlan 10
 speed auto
 duplex auto
 no shutdown
!
interface GigabitEthernet0/0/2
 description trunk-port toward dist switch
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30
 speed 1000
 duplex full
 no shutdown
!
interface GigabitEthernet0/0/3
 description spare-down port
 shutdown
!
end

