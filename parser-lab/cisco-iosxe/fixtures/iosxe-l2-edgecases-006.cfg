! synthetic fixture
! no customer data
! purpose: IOS-XE L2 edge cases for later parser integration
! feature coverage tags: vlan ranges, trunk edge cases, svi variant, l2 shutdown state, description punctuation, optional lines
version 17.9
hostname iosxe-l2-edge-006
!
vlan 200
 name BUILDING-A
!
vlan 210
 name BUILDING-B
!
vlan 220
 name BUILDING-C
!
interface Vlan200
 description campus-svi, primary
 ip address 192.0.2.200 255.255.255.0
 no shutdown
!
interface Vlan210
 description campus-svi; backup
 ip address 192.0.2.210 255.255.255.0
 shutdown
!
interface Vlan220
 description campus-svi / transit
 no shutdown
!
interface GigabitEthernet2/0/1
 description edge-access
 switchport mode access
 switchport access vlan 200
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet2/0/2
 description edge-trunk, range case
 switchport mode trunk
 switchport trunk native vlan 210
 switchport trunk allowed vlan 200-220
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet2/0/3
 description dormant-edge
 switchport mode access
 switchport access vlan 220
 shutdown
!
interface GigabitEthernet2/0/4
 description optional-line-sink
 switchport mode trunk
 switchport trunk native vlan 220
 switchport trunk allowed vlan 200,210,220
 no cdp enable
 no shutdown
!
end

