! synthetic fixture
! no customer data
! purpose: IOS-XE port-channel, VLAN, and SVI parser prep
! feature coverage tags: port-channel, member interfaces, channel-group, trunk allowed vlans, native vlan, svi, spanning-tree hint, descriptions
version 17.9
hostname iosxe-portch-003
!
vlan 10
 name USERS
!
vlan 20
 name VOICE
!
vlan 30
 name WIFI
!
vlan 999
 name MGMT-NATIVE
!
interface Port-channel10
 description uplink-to-distribution
 switchport
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30
 spanning-tree portfast trunk
 no shutdown
!
interface GigabitEthernet1/0/1
 description member-1 toward dist
 switchport
 channel-group 10 mode active
 no shutdown
!
interface GigabitEthernet1/0/2
 description member-2 toward dist
 switchport
 channel-group 10 mode active
 no shutdown
!
interface GigabitEthernet1/0/3
 description spare-member-admin-down
 switchport
 channel-group 10 mode active
 shutdown
!
interface Vlan999
 description management-svi
 ip address 198.51.100.10 255.255.255.0
 no shutdown
!
end

