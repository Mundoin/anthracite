! synthetic fixture
! no customer data
! purpose: IOS-XE access, trunk, native VLAN, and voice VLAN parser prep
! feature coverage tags: access vlan, voice vlan, trunk native vlan, vlan ranges, vlan list, svi variant, stp hints
version 17.9
hostname iosxe-l2-voice-005
!
vlan 10
 name DATA
!
vlan 20
 name VOICE
!
vlan 99
 name MGMT
!
vlan 100
 name CCTV
!
interface Vlan99
 description management-svi
 ip address 203.0.113.99 255.255.255.0
 no shutdown
!
interface Vlan100
 description quarantine-svi
 ip address 203.0.113.100 255.255.255.0
 shutdown
!
interface GigabitEthernet1/0/1
 description user-edge access
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/0/2
 description phone-plus-pc edge
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/24
 description uplink-to-core
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99-100
 spanning-tree portfast trunk
 no shutdown
!
interface GigabitEthernet1/0/25
 description spare-l2-edge-down
 switchport mode access
 switchport access vlan 100
 shutdown
!
end

