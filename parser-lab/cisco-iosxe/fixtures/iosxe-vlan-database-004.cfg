! synthetic fixture
! no customer data
! purpose: IOS-XE VLAN database and SVI parser prep
! feature coverage tags: vlan database, svi variants, access ports, trunk ports, voice vlan, stp hint, l2 edge cases
version 17.9
hostname iosxe-vlan-db-004
!
vlan 10
 name USERS
!
vlan 20
 name VOICE
!
vlan 30
 name IOT
!
vlan 40
 name GUEST
!
vlan 999
 name NATIVE-MGMT
!
interface Vlan10
 description users-svi
 ip address 192.0.2.10 255.255.255.0
 no shutdown
!
interface Vlan20
 description voice-svi
 ip address 192.0.2.20 255.255.255.0
 shutdown
!
interface Vlan30
 description iot-svi
 ip address 198.51.100.30 255.255.255.0
 ip helper-address 203.0.113.10
 no shutdown
!
interface GigabitEthernet0/1
 description access-users
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/2
 description access-voice
 switchport mode access
 switchport access vlan 20
 switchport voice vlan 30
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/3
 description trunk-to-distribution
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-40
 spanning-tree portfast trunk
 no shutdown
!
end

