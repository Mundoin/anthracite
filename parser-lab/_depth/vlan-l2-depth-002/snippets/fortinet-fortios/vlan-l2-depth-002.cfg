        set alias "trunk-uplink"
        set role lan
    next
    edit "VLAN10"
        set interface "port2"
        set vlanid 10
        set alias "users-vlan"
        set ip 192.0.2.10 255.255.255.0
    next
    edit "VLAN20"
        set interface "port2"
        set vlanid 20
        set alias "voice-vlan"
        set ip 192.0.2.20 255.255.255.0
