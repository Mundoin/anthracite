! synthetic fixture snippet
! vendor: Fortinet
! platform: fortios
! feature tags: ssh, snmp, ntp, logging, aaa, local_users, note_only_security, note_only_routing
! source: synthetic
! integration_status: not_integrated
config system global
    set hostname "fg-mgmt-005"
    set admin-ssh-port 2222
end
config system admin
    edit "admin"
        set accprofile super_admin
        set ssh-public-key1 "ssh-rsa fake-key"
    next
end
config user local
    edit "ops"
        set type password
        set passwd fake-pass
    next
end
config system snmp community
    edit "public"
        set status enable
    next
end
config system ntp
    set status enable
end
# note-only: acl / nat / qos / security / routing markers stay conservative.

