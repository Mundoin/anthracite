# synthetic fixture
# no customer data
# purpose: SR OS system identity, routed interfaces, static routes, and management-plane hints
# feature coverage tags: system-identity, interfaces, loopback, routed-interface, static-route, management-plane, note-only markers
configure system name "sros-core-001"
configure system login-control idle-timeout 15
configure port 1/1/1
 description "wan-uplink"
 ethernet
  mode network
  encap-type dot1q
 exit
exit
configure router Base
 interface "lo0" create
  address 192.0.2.1/32
  loopback
 exit
 interface "to-wan" create
  address 198.51.100.2/30
  port 1/1/1
 exit
 static-route-entry 0.0.0.0/0 next-hop 198.51.100.1
 static-route-entry 203.0.113.0/24 next-hop 203.0.113.1
exit
configure system snmp
 admin-state enable
exit
configure system security ssh
 admin-state enable
exit
configure system time ntp
 server 192.0.2.53
exit
