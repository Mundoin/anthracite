! synthetic fixture
! no customer data
! purpose: LLDP support and adjacency-safe hints
! feature tags: lldp, adjacency-support, interface-peer-hints
! source: synthetic
! integration_status: not_integrated
! note-only: LLDP enablement is not an edge by itself.

! === lldp-iosxe-001 | vendor=Cisco | platform=IOS-XE ===
hostname lldp-iosxe-001
lldp run
interface GigabitEthernet0/0/0
 description uplink-to-agg-01
 no shutdown
interface GigabitEthernet0/0/1
 description downlink-to-access-01
 no shutdown

! === lldp-nxos-002 | vendor=Cisco | platform=NX-OS ===
hostname lldp-nxos-002
feature lldp
interface Ethernet1/1
 description peer-to-leaf-01
 no shutdown
interface Ethernet1/2
 description peer-to-server-01
 no shutdown

! === lldp-junos-003 | vendor=Juniper | platform=Junos ===
system {
    host-name lldp-junos-003;
}
protocols {
    lldp {
        interface all;
    }
}
interfaces {
    ge-0/0/0 {
        description uplink-to-core-01;
        unit 0 {
            family inet {
                address 192.0.2.10/30;
            }
        }
    }
}
