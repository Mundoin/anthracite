! === risk-iosxe-001 | vendor=Cisco | platform=IOS-XE ===
hostname risk-iosxe-001
interface Loopback0
 ip address 192.0.2.30 255.255.255.255
interface GigabitEthernet0/0/0
 description peer-aggregation
 ip address 10.0.0.1 255.255.255.252
 no shutdown
router ospf 1
 router-id 192.0.2.30
 network 10.0.0.0 0.0.0.3 area 0
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
router bgp 65001
 bgp router-id 192.0.2.30
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 description peer-aggregation
 address-family ipv4
  neighbor 10.0.0.2 activate
 exit-address-family
ip route 0.0.0.0 0.0.0.0 198.51.100.1

! === risk-eos-002 | vendor=Arista | platform=EOS ===
