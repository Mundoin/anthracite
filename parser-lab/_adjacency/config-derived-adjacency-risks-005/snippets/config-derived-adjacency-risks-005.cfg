interface Ethernet1
   description peer-spine
   no switchport
   ip address 10.0.1.1/30
   no shutdown
router ospf 1
   router-id 192.0.2.31
   network 10.0.1.0/30 area 0
router bgp 65001
   router-id 192.0.2.31
   neighbor 10.0.1.2 remote-as 65002
