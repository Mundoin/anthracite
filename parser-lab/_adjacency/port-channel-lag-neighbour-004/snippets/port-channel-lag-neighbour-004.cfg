! synthetic fixture
! no customer data
! purpose: port-channel / LAG neighbour hints
! feature tags: port-channel, lacp, adjacency-support
! source: synthetic
! integration_status: not_integrated
! note-only: bundle membership is not a remote edge by itself.

! === lag-iosxe-001 | vendor=Cisco | platform=IOS-XE ===
hostname lag-iosxe-001
interface GigabitEthernet0/1/0
 description member-to-leaf-a
 channel-group 10 mode active
 no shutdown
interface GigabitEthernet0/1/1
 description member-to-leaf-b
 channel-group 10 mode active
 no shutdown
interface Port-channel10
 description uplink-bundle-a
 switchport
 switchport mode trunk
 switchport trunk native vlan 4094
 switchport trunk allowed vlan 10,20,30
 no shutdown

! === lag-nxos-002 | vendor=Cisco | platform=NX-OS ===
hostname lag-nxos-002
feature lacp
interface Ethernet1/1
 description member-to-leaf-a
 channel-group 1 mode active
 no shutdown
interface Ethernet1/2
 description member-to-leaf-b
 channel-group 1 mode active
 no shutdown
interface port-channel1
 description uplink-bundle-b
 switchport
 switchport mode trunk
 switchport trunk native vlan 4094
 switchport trunk allowed vlan 10-30
 no shutdown

! === lag-junos-003 | vendor=Juniper | platform=Junos ===
system {
    host-name lag-junos-003;
}
interfaces {
    ge-0/0/0 {
        gigether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/1 {
        gigether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        description uplink-bundle-c;
        aggregated-ether-options {
            lacp active;
        }
        unit 0 {
            family inet {
                address 192.0.2.1/30;
            }
        }
    }
}
