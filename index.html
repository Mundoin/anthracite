<!doctype html>
<html lang="en" data-scheme="noc-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anthracite</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Emergency marker outside the React root. If this remains visible
      while #root goes blank, React unmounted; if the marker disappears
      too, the webview navigated/reloaded.
    -->
    <div
      id="anthracite-emergency-marker"
      style="position:fixed;bottom:6px;right:8px;font:11px ui-monospace,Consolas,monospace;color:#5a4a44;background:rgba(20,12,10,0.55);padding:2px 6px;border-radius:3px;pointer-events:none;z-index:2147483646;"
    >anthracite shell</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
