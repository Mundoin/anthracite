!
! Cisco IOS baseline services posture: SSH, SNMP, NTP, DNS, syslog.
! Exercises every services_* coverage area and the SNMP-as-two-records rule.
!
hostname svc-host-01
!
ip ssh version 2
ip ssh time-out 60
ip ssh source-interface Loopback0
!
snmp-server community PUBLIC-COMM RO
snmp-server community PRIVATE-COMM RW
snmp-server location DataCenter-A
snmp-server contact noc@example.test
snmp-server host 10.0.0.50 PUBLIC-COMM
snmp-server host 10.0.0.51 PUBLIC-COMM
snmp-server source-interface Loopback0
!
ntp server 10.0.0.1
ntp server 10.0.0.2
ntp source Loopback0
!
ip name-server 10.0.0.10 10.0.0.11
ip domain name example.test
!
logging host 10.0.0.100
logging trap informational
logging source-interface Loopback0
logging facility local6
!
interface Loopback0
 ip address 192.0.2.100 255.255.255.255
!
end
