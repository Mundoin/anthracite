!
hostname cross-vendor-eq
!
vrf definition MGMT
 rd 65000:1
!
vlan 100
 name USERS
!
interface Loopback0
 ip address 192.0.2.99 255.255.255.255
!
interface GigabitEthernet0/0/0
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.0.0.2
!
ip ssh version 2
!
snmp-server community PUBLIC RO
!
ntp server 10.0.0.1
!
ip name-server 10.0.0.10
ip domain name example.test
!
logging host 10.0.0.100
!
end
