!Command: show running-config
version 9.3(10)
hostname nxos-services-01
!
feature ssh
!
interface mgmt0
  ip address 10.100.0.5/24
!
ntp server 10.0.0.10
ntp server 10.0.0.11
ntp source-interface mgmt0
!
logging server 10.0.0.50
logging server 10.0.0.51
logging source-interface mgmt0
logging facility local6
!
ip name-server 10.0.0.10
ip name-server 10.0.0.11
ip domain-name corp.example.com
!
snmp-server community READONLY RO
snmp-server community READWRITE RW
snmp-server host 10.0.0.60 traps version 2c READONLY
snmp-server location dc2-rack-3
snmp-server contact noc@example.com
!
end
