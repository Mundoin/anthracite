!Command: show running-config
version 9.3(8)
hostname cross-vendor-eq
!
feature ssh
!
vrf context MGMT
  rd 65000:1
!
vlan 100
  name USERS
!
interface loopback0
  ip address 192.0.2.99/32
!
interface Ethernet1/1
  no switchport
  ip address 10.0.0.1/30
  no shutdown
!
ip route 0.0.0.0/0 10.0.0.2
!
snmp-server community PUBLIC RO
!
ntp server 10.0.0.1
!
ip name-server 10.0.0.10
ip domain-name example.test
!
logging server 10.0.0.100
!
end
