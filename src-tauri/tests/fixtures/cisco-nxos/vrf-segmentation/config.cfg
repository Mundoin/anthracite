!Command: show running-config
version 9.3(8)
hostname nxos-vrf-01
!
feature ssh
!
vrf context MGMT
  rd 65000:1
  ip route 0.0.0.0/0 10.100.0.1
!
vrf context CUST-A
  rd 65001:100
  route-target import 65001:100
  route-target export 65001:100
!
vrf context CUST-B
  rd 65001:200
  route-target import 65001:200
  route-target export 65001:200
!
interface mgmt0
  vrf member MGMT
  ip address 10.100.0.5/24
!
interface loopback0
  description router-id
  ip address 10.255.0.1/32
!
interface Ethernet1/1
  description cust-a-uplink
  vrf member CUST-A
  ip address 10.0.1.1/30
  no shutdown
!
interface Ethernet1/2
  description cust-b-uplink
  vrf member CUST-B
  ip address 10.0.2.1/30
  no shutdown
!
ntp server use-vrf MGMT 10.100.0.10
!
end
