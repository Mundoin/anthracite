!Command: show running-config
!
! NX-OS divergences from IOS-XE captured in this fixture:
!   - feature-based SSH (not ip ssh version 2)
!   - vrf context (not vrf definition)
!   - ip route inside vrf context block
!   - loopback (lowercase, not Loopback)
!   - port-channel (lowercase, not Port-channel)
!   - mgmt0 (not Management0)
!   - ip name-server with use-vrf
!   - ntp server with use-vrf
!
version 9.3(8)
hostname nxos-diverge-01
!
feature ssh
feature ntp
!
vrf context OOB
  rd 65099:1
  ip route 0.0.0.0/0 10.200.0.1
!
interface mgmt0
  vrf member OOB
  ip address 10.200.0.10/24
!
interface loopback0
  ip address 10.255.1.1/32
!
interface port-channel1
  description uplink-bundle
  no switchport
  ip address 10.0.0.1/30
!
interface Ethernet1/1
  channel-group 1 mode active
!
interface Ethernet1/2
  channel-group 1 mode active
!
ip route 10.0.0.0/8 10.0.0.2
ip name-server use-vrf OOB 10.200.0.53
ntp server use-vrf OOB 10.200.0.123
logging server 10.200.0.50
!
end
