system {
    host-name j-wan-edge;
}
interfaces {
    ge-0/0/0 {
        description physical-uplink;
        mtu 1500;
        unit 100 {
            description customer-a;
            family inet {
                address 172.16.100.1/24;
            }
        }
        unit 200 {
            description customer-b;
            family inet {
                address 172.16.200.1/24;
            }
        }
        unit 300 {
            description customer-c;
            family inet {
                address 172.16.30.1/30;
            }
        }
    }
    ge-0/0/1 {
        description core-uplink;
        unit 0 {
            family inet {
                address 10.255.0.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.0.2.1/32;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 10.255.0.2;
    }
}
