set system host-name cross-vendor-eq
set system services ssh
set system ntp server 10.0.0.1
set system name-server 10.0.0.10
set system domain-name example.test
set system syslog host 10.0.0.100 any info
set snmp community PUBLIC
set interfaces lo0 unit 0 family inet address 192.0.2.99/32
set interfaces ge-0/0/0 unit 0 family inet address 10.0.0.1/30
set vlans USERS vlan-id 100
set routing-instances MGMT instance-type vrf
set routing-instances MGMT route-distinguisher 65000:1
set routing-options static route 0.0.0.0/0 next-hop 10.0.0.2
