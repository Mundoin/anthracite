set system host-name j-small
set system name-server 10.0.0.10
set system domain-name example.test
set system ntp server 10.0.0.1
set system syslog host 10.0.0.100 any info
set system services ssh
set snmp community PUBLIC
set snmp location DC-A
set snmp contact noc@example.test
set interfaces ge-0/0/0 description uplink
set interfaces ge-0/0/0 unit 0 family inet address 10.0.0.1/24
set interfaces lo0 unit 0 family inet address 192.0.2.1/32
set vlans USERS vlan-id 10
set routing-options static route 0.0.0.0/0 next-hop 10.0.0.2
