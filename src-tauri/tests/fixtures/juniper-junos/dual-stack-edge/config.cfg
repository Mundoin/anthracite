system {
    host-name j-dual-edge;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 192.0.2.20/32;
            }
            family inet6 {
                address 2001:db8::20/128;
            }
        }
    }
    ge-0/0/0 {
        description north-uplink;
        unit 0 {
            family inet {
                address 198.51.100.1/30;
            }
            family inet6 {
                address 2001:db8:1::1/64;
            }
        }
    }
    ge-0/0/1 {
        description south-downlink;
        unit 0 {
            family inet {
                address 198.51.100.5/30;
            }
            family inet6 {
                address 2001:db8:2::1/64;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 198.51.100.2;
    }
    rib inet6.0 {
        static {
            route ::/0 next-hop 2001:db8:1::2;
        }
    }
}
