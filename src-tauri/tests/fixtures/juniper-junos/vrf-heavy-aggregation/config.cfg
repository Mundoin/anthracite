system {
    host-name j-agg-pe;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.100.0.1/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.200.0.1/30;
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet {
                address 10.30.0.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.0.2.10/32;
            }
        }
    }
}
routing-instances {
    CUSTOMER-A {
        instance-type vrf;
        route-distinguisher 65000:100;
        vrf-target target:65000:100;
        interface ge-0/0/0.0;
        routing-options {
            static {
                route 192.168.100.0/24 next-hop 10.100.0.2;
            }
        }
    }
    CUSTOMER-B {
        instance-type vrf;
        route-distinguisher 65000:200;
        vrf-target target:65000:200;
        interface ge-0/0/1.0;
        routing-options {
            static {
                route 192.168.200.0/24 next-hop 10.200.0.2;
            }
        }
    }
    CUSTOMER-C {
        instance-type vrf;
        route-distinguisher 65000:300;
        vrf-target target:65000:300;
        interface ge-0/0/2.0;
        routing-options {
            static {
                route 192.168.30.0/24 next-hop 10.30.0.2;
            }
        }
    }
}
