system {
    host-name j-small;
    name-server 10.0.0.10;
    domain-name example.test;
    ntp {
        server 10.0.0.1;
    }
    syslog {
        host 10.0.0.100 any info;
    }
    services {
        ssh;
    }
}
snmp {
    community PUBLIC;
    location DC-A;
    contact noc@example.test;
}
interfaces {
    ge-0/0/0 {
        description uplink;
        unit 0 {
            family inet {
                address 10.0.0.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.0.2.1/32;
            }
        }
    }
}
vlans {
    USERS {
        vlan-id 10;
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 10.0.0.2;
    }
}
