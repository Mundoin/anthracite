system {
    host-name j-protocols;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 192.0.2.30/32;
            }
        }
    }
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.0.1/30;
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0;
        }
    }
    bgp {
        group EBGP {
            type external;
            neighbor 10.0.0.2 {
                peer-as 65002;
            }
        }
    }
}
policy-options {
    policy-statement EXPORT-ALL {
        from protocol direct;
        then accept;
    }
}
firewall {
    family inet {
        filter PROTECT-LO {
            term default {
                then accept;
            }
        }
    }
}
