!
! Cisco IOS-XE — VRF-heavy aggregation device (no MPLS parsing in V1L).
!
hostname agg-pe-01
!
vrf definition CUSTOMER-A
 rd 65000:100
 address-family ipv4
  route-target import 65000:100
  route-target export 65000:100
!
vrf definition CUSTOMER-B
 rd 65000:200
 address-family ipv4
  route-target import 65000:200
  route-target export 65000:200
!
vrf definition CUSTOMER-C
 rd 65000:300
 address-family ipv4
  route-target import 65000:300
  route-target export 65000:300
!
vrf definition MGMT
 rd 65000:1
 address-family ipv4
  route-target import 65000:1
  route-target export 65000:1
!
interface Loopback0
 ip address 192.0.2.10 255.255.255.255
!
interface GigabitEthernet0/0/0
 description ce-customer-a
 vrf forwarding CUSTOMER-A
 ip address 10.100.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/1
 description ce-customer-b
 vrf forwarding CUSTOMER-B
 ip address 10.200.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/2
 description ce-customer-c
 vrf forwarding CUSTOMER-C
 ip address 10.30.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/3
 description mgmt-link
 vrf forwarding MGMT
 ip address 10.1.0.1 255.255.255.0
 no shutdown
!
ip route vrf CUSTOMER-A 192.168.100.0 255.255.255.0 10.100.0.2
ip route vrf CUSTOMER-B 192.168.200.0 255.255.255.0 10.200.0.2
ip route vrf CUSTOMER-C 192.168.30.0 255.255.255.0 10.30.0.2
!
end
