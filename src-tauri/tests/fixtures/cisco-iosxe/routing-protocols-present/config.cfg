!
! Cisco IOS-XE — OSPF and BGP blocks present.
! V1L does NOT parse routing protocols; every routing line should land
! in unknown_lines[] with the router-block context_path, and warnings
! should include not_in_scope:routing_protocols_block.
!
hostname routing-edge-01
!
interface Loopback0
 ip address 192.0.2.30 255.255.255.255
!
interface GigabitEthernet0/0/0
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 192.0.2.30
 network 10.0.0.0 0.0.0.3 area 0
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
!
router bgp 65001
 bgp router-id 192.0.2.30
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 description peer-aggregation
 address-family ipv4
  neighbor 10.0.0.2 activate
 exit-address-family
!
end
