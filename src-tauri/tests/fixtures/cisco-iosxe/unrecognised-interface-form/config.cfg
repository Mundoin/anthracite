!
! Cisco IOS-XE — interface form the V1K/V1L classifier does not recognise.
! Exercises UnknownReason::UnrecognizedInterfaceForm (added V1L).
!
hostname weird-iface-01
!
interface Bizarre1/0
 description not-a-real-form
 ip address 10.99.0.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/0
 description known-form
 ip address 10.1.0.1 255.255.255.0
 no shutdown
!
end
