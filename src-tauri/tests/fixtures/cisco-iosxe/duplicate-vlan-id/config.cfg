!
! Cisco IOS-XE — duplicate VLAN id declared with different attributes.
! Last-write-wins is non-deterministic, so VlanBuilder must merge by id.
!
hostname dup-vlan-01
!
vlan 100
 name FIRST-NAME
!
vlan 100
 name SECOND-NAME
 state suspend
!
interface GigabitEthernet0/0/0
 switchport mode access
 switchport access vlan 100
 no shutdown
!
interface GigabitEthernet0/0/1
 switchport mode access
 switchport access vlan 100
 no shutdown
!
end
