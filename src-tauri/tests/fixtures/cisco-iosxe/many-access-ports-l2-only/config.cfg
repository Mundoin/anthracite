!
! Cisco IOS-XE — many access ports, L2-only switch.
!
hostname access-sw-01
!
vlan 10
 name USERS
!
vlan 20
 name VOICE
!
vlan 30
 name MGMT
!
interface Vlan30
 description mgmt-svi
 ip address 10.30.0.10 255.255.255.0
!
interface GigabitEthernet1/0/1
 description user-port-1
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface GigabitEthernet1/0/2
 description user-port-2
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface GigabitEthernet1/0/3
 description user-port-3
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface GigabitEthernet1/0/4
 description user-port-4
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface GigabitEthernet1/0/5
 description voice-port-1
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface GigabitEthernet1/0/6
 description voice-port-2
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface GigabitEthernet1/0/7
 description voice-port-3
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface GigabitEthernet1/0/8
 description voice-port-4
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface GigabitEthernet1/0/24
 description uplink-to-dist
 switchport mode trunk
 switchport trunk native vlan 30
 switchport trunk allowed vlan 10,20,30
 no shutdown
!
end
