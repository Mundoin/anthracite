!
! Cisco IOS-XE — comments and banner blocks.
! Comments are is_skip lines (parser uses them for chassis/serial markers).
! Banners are out of V1L scope; should be tolerated, not crash.
!
! Chassis: ISR4451
! Last configuration change at 12:34:56 UTC Mon Jan 1 2026
!
hostname banner-host-01
!
banner motd ^
WARNING: authorised access only.
This system is monitored.
^
!
banner login ^C
Login banner line one.
Login banner line two.
^C
!
interface GigabitEthernet0/0/0
 description ! comment-in-description
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
end
