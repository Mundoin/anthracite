!
! Cisco IOS-XE — WAN edge router with dot1q sub-interfaces.
!
hostname wan-edge-01
!
interface GigabitEthernet0/0/0
 description physical-uplink
 mtu 1500
 no shutdown
!
interface GigabitEthernet0/0/0.100
 description customer-a
 ip address 172.16.100.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/0.200
 description customer-b
 ip address 172.16.200.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/0.300
 description customer-c
 ip address 172.16.30.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/1
 description core-uplink
 ip address 10.255.0.1 255.255.255.252
 no shutdown
!
interface Loopback0
 description router-id
 ip address 192.0.2.1 255.255.255.255
!
ip route 0.0.0.0 0.0.0.0 10.255.0.2 name default-via-core
!
end
