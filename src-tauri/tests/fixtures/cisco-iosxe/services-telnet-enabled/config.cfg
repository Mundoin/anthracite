! V1Z-A — Cisco IOS-XE Telnet enabled via line vty transport input.
! Minimal fixture: hostname + Loopback + line vty block permitting
! both Telnet and SSH. Proves the parser emits ServiceKind::Telnet.
version 17.9
hostname iosxe-telnet-on
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
ip ssh version 2
line vty 0 4
 exec-timeout 5 0
 transport input telnet ssh
 login local
!
end
