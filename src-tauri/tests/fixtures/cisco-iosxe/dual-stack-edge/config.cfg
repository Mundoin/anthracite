!
! Cisco IOS-XE — dual-stack IPv4 + IPv6 edge.
!
hostname dual-edge-01
!
interface Loopback0
 ip address 192.0.2.20 255.255.255.255
 ipv6 address 2001:db8::20/128
!
interface GigabitEthernet0/0/0
 description north-uplink
 ip address 198.51.100.1 255.255.255.252
 ipv6 address 2001:db8:1::1/64
 no shutdown
!
interface GigabitEthernet0/0/1
 description south-downlink
 ip address 198.51.100.5 255.255.255.252
 ipv6 address 2001:db8:2::1/64
 no shutdown
!
interface Vlan100
 description user-svi
 ip address 10.100.0.1 255.255.255.0
 ipv6 address 2001:db8:100::1/64
!
ip route 0.0.0.0 0.0.0.0 198.51.100.2
ipv6 route ::/0 2001:db8:1::2
!
end
