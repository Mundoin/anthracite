!
! Cisco IOS-XE — interface references VRF before vrf definition appears.
! Exercises VRF resolution under out-of-order config.
!
hostname order-edge-01
!
interface GigabitEthernet0/0/0
 description ce-link-defined-before-vrf
 vrf forwarding LATE-VRF
 ip address 10.10.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/1
 description native-vrf-link
 ip address 10.20.0.1 255.255.255.252
 no shutdown
!
vrf definition LATE-VRF
 rd 65000:999
 address-family ipv4
  route-target import 65000:999
  route-target export 65000:999
!
end
