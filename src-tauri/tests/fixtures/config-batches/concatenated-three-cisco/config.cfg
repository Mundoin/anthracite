service timestamps debug datetime msec
boot-start-marker
boot-end-marker
hostname r1
no ip domain lookup
interface GigabitEthernet0/0
 ip address 10.0.1.1 255.255.255.0
ip route 0.0.0.0 0.0.0.0 10.0.1.254
line vty 0 4
 transport input ssh
end
