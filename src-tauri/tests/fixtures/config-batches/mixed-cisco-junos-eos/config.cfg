service timestamps debug datetime msec
boot-start-marker
boot-end-marker
hostname r-cisco
no ip domain lookup
interface GigabitEthernet0/0
 ip address 10.0.1.1 255.255.255.0
ip route 0.0.0.0 0.0.0.0 10.0.1.254
line vty 0 4
 transport input ssh
end
system {
    host-name r-junos;
    services {
        ssh;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet { address 10.0.2.1/30; }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 { interface ge-0/0/0.0; }
    }
}
routing-options {
    router-id 10.0.2.1;
}
daemon TerminAttr
   exec /usr/bin/TerminAttr -ingestgrpcurl=127.0.0.1:9910
   no shutdown
!
hostname r-eos
transceiver qsfp default-mode 4x10G
mlag configuration
   domain-id leaf
   local-interface Vlan4094
ip routing
interface Ethernet1
   no switchport
   ip address 10.0.3.1/30
management api http-commands
   no shutdown
