! synthetic fixture
! purpose: FortiOS common-bar uplift with services and core L2/L3 coverage
! feature coverage tags: system-global, interfaces, vlan-interface, zones, static-routes, services
config system global
    set hostname "fg-common-001"
    set admintimeout 12
end
config system interface
    edit "port1"
        set vdom "root"
        set alias "wan-uplink"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping https ssh
        set role wan
    next
    edit "port2"
        set vdom "root"
        set alias "lan-trunk"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https
        set role lan
    next
    edit "VLAN10"
        set vdom "root"
        set interface "port2"
        set vlanid 10
        set alias "users-vlan"
        set ip 192.0.2.10 255.255.255.0
        set role lan
    next
end
config system zone
    edit "LAN"
        set interface "port2" "VLAN10"
    next
    edit "WAN"
        set interface "port1"
    next
end
config system dns
    set primary 192.0.2.53
    set secondary 192.0.2.54
end
config system ntp
    set server 192.0.2.100
end
config system snmp
    set status enable
    set contact "noc@example.test"
end
config log syslogd setting
    set status enable
    set server 192.0.2.200
end
config router static
    edit 1
        set dst 0.0.0.0/0
        set gateway 198.51.100.1
        set device "port1"
    next
end
