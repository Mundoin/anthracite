sysname vrp-core-1
version 8.220
vlan batch 10 20 30
interface GigabitEthernet0/0/1
 description uplink-a
 undo shutdown
 ip address 192.0.2.1 255.255.255.252
 eth-trunk 1
interface GigabitEthernet0/0/2
 description uplink-b
 undo shutdown
 ip address 192.0.2.5 255.255.255.252
 eth-trunk 1
interface GigabitEthernet0/0/3
 description user-access
 undo shutdown
 ip address 10.0.20.2 255.255.255.0
 port link-type access
 port default vlan 20
interface Eth-Trunk1
 description core-bundle
 mode lacp-static
 ip address 198.51.100.1 255.255.255.252
 port link-type trunk
 port trunk allow-pass vlan 10 20 30
 trunkport GigabitEthernet0/0/1
 trunkport GigabitEthernet0/0/2
interface Vlanif10
 ip address 10.0.10.1 255.255.255.0
interface Vlanif20
 ip address 10.0.20.1 255.255.255.0
ip vpn-instance MGMT
 route-distinguisher 65000:1
 vpn-target 65000:1 export-extcommunity
 vpn-target 65000:1 import-extcommunity
 ipv4-family
quit
interface GigabitEthernet0/0/4
 description mgmt
 undo shutdown
 ip binding vpn-instance MGMT
 ip address 10.1.0.1 255.255.255.0
ip route-static 0.0.0.0 0 192.0.2.2
ip route-static vpn-instance MGMT 10.1.0.0 255.255.255.0 10.1.0.254
user-interface vty 0 4
 protocol inbound telnet
stelnet server enable
snmp-agent
ntp-service enable
ntp-service unicast-server 192.0.2.100
dns server 192.0.2.53
info-center loghost 192.0.2.200
