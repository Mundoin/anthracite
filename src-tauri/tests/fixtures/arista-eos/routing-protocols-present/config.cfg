!
hostname eos-routing-01
!
interface Loopback0
   ip address 192.0.2.30/32
!
interface Ethernet1
   no switchport
   ip address 10.0.0.1/30
   no shutdown
!
router ospf 1
   router-id 192.0.2.30
   network 10.0.0.0/30 area 0
   passive-interface default
   no passive-interface Ethernet1
!
router bgp 65001
   router-id 192.0.2.30
   neighbor 10.0.0.2 remote-as 65002
   neighbor 10.0.0.2 description peer-spine
   address-family ipv4
      neighbor 10.0.0.2 activate
!
end
