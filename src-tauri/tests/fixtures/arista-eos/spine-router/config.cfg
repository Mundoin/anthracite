!
hostname eos-spine-01
!
interface Loopback0
   description router-id
   ip address 192.0.2.1/32
!
interface Loopback1
   description vtep
   ip address 192.0.2.101/32
!
interface Ethernet1
   description leaf-1-uplink
   no switchport
   ip address 10.0.1.0/31
   no shutdown
!
interface Ethernet2
   description leaf-2-uplink
   no switchport
   ip address 10.0.1.2/31
   no shutdown
!
interface Ethernet3
   description leaf-3-uplink
   no switchport
   ip address 10.0.1.4/31
   no shutdown
!
interface Ethernet4
   description leaf-4-uplink
   no switchport
   ip address 10.0.1.6/31
   no shutdown
!
ip route 0.0.0.0/0 10.0.1.1
!
end
