! device: eos-small-01
! boot system flash:/EOS-4.30.5M.swi
!
hostname eos-small-01
!
vlan 10
   name USERS
!
vrf instance MGMT
   rd 65000:1
!
interface Loopback0
   ip address 192.0.2.50/32
!
interface Management1
   vrf MGMT
   ip address 10.1.0.50/24
!
interface Ethernet1
   no switchport
   ip address 10.0.0.1/30
   no shutdown
!
interface Ethernet2
   switchport mode access
   switchport access vlan 10
   no shutdown
!
interface Ethernet3
   channel-group 10 mode active
   no shutdown
!
interface Ethernet4
   channel-group 10 mode active
   no shutdown
!
interface Port-Channel10
   switchport mode trunk
   switchport trunk allowed vlan 10
   no shutdown
!
ip route vrf MGMT 0.0.0.0/0 10.1.0.1
ip route 0.0.0.0/0 10.0.0.2
!
management ssh
   idle-timeout 30
   vrf MGMT
!
snmp-server community PUBLIC ro
snmp-server location dc-a
snmp-server contact noc@example.test
snmp-server host 10.0.0.100
!
ntp server 10.0.0.1
ntp source Loopback0
!
ip name-server 10.0.0.10
ip domain-name example.test
!
logging host 10.0.0.100
logging facility local6
logging trap informational
logging source-interface Loopback0
!
end
