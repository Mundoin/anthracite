!
hostname eos-vrf-agg
!
vrf instance CUSTOMER-A
   rd 65000:100
   route-target import 65000:100
   route-target export 65000:100
!
vrf instance CUSTOMER-B
   rd 65000:200
   route-target import 65000:200
   route-target export 65000:200
!
vrf instance MGMT
   rd 65000:1
!
interface Loopback0
   ip address 192.0.2.10/32
!
interface Ethernet1
   description ce-customer-a
   vrf CUSTOMER-A
   no switchport
   ip address 10.100.0.1/30
   no shutdown
!
interface Ethernet2
   description ce-customer-b
   vrf CUSTOMER-B
   no switchport
   ip address 10.200.0.1/30
   no shutdown
!
interface Management1
   vrf MGMT
   ip address 10.1.0.10/24
!
ip route vrf CUSTOMER-A 192.168.100.0/24 10.100.0.2
ip route vrf CUSTOMER-B 192.168.200.0/24 10.200.0.2
ip route vrf MGMT 0.0.0.0/0 10.1.0.1
!
end
