!
hostname cross-vendor-eq
!
vrf instance MGMT
   rd 65000:1
!
vlan 100
   name USERS
!
interface Loopback0
   ip address 192.0.2.99/32
!
interface Ethernet1
   no switchport
   ip address 10.0.0.1/30
   no shutdown
!
ip route 0.0.0.0/0 10.0.0.2
!
management ssh
   idle-timeout 30
!
snmp-server community PUBLIC ro
!
ntp server 10.0.0.1
!
ip name-server 10.0.0.10
ip domain-name example.test
!
logging host 10.0.0.100
!
end
