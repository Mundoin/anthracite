!
hostname eos-leaf-01
!
vlan 10
   name USERS
!
vlan 20
   name VOICE
!
vlan 30
   name MGMT
!
interface Vlan30
   ip address 10.30.0.10/24
!
interface Ethernet1
   switchport mode access
   switchport access vlan 10
   no shutdown
!
interface Ethernet2
   switchport mode access
   switchport access vlan 10
   no shutdown
!
interface Ethernet3
   switchport mode access
   switchport access vlan 10
   no shutdown
!
interface Ethernet4
   switchport mode access
   switchport access vlan 20
   no shutdown
!
interface Ethernet5
   switchport mode access
   switchport access vlan 20
   no shutdown
!
interface Ethernet47
   channel-group 100 mode active
   no shutdown
!
interface Ethernet48
   channel-group 100 mode active
   no shutdown
!
interface Port-Channel100
   description uplink-to-spine
   switchport mode trunk
   switchport trunk native vlan 30
   switchport trunk allowed vlan 10,20,30
   no shutdown
!
end
