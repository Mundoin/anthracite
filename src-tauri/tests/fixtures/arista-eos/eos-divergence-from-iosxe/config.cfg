!
! Highlights EOS-specific syntax that an IOS/XE parser would mis-handle:
!   - `vrf instance NAME`  (Cisco uses `vrf definition NAME`)
!   - `management ssh`     (Cisco uses `ip ssh ...`)
!   - `channel-group N mode active` lives unchanged but classified via
!     EOS's lag.rs, not IOS/XE's.
!
hostname eos-divergent-01
!
vrf instance MGMT
   rd 65000:1
!
interface Management1
   vrf MGMT
   ip address 10.1.0.20/24
!
interface Ethernet1
   no switchport
   ip address 10.0.0.1/30
   no shutdown
!
interface Ethernet2
   channel-group 1 mode active
   no shutdown
!
interface Ethernet3
   channel-group 1 mode active
   no shutdown
!
interface Port-Channel1
   description bundle-with-eos-style-lacp
   no switchport
   ip address 10.0.10.1/30
   no shutdown
!
management ssh
   idle-timeout 60
   vrf MGMT
!
end
