hostname aoscx-01
interface 1/1/1
   description uplink
   no shutdown
   ip address 198.51.100.2/30
   vlan trunk allowed 10 20
interface 1/1/2
   no shutdown
   lag 1
interface lag 1
   no shutdown
   vlan access 10
   lacp mode active
vlan 10
   name users
   interface 1/1/1
vrf MGMT
   route-distinguisher 65000:10
   interface 1/1/1
   address-family ipv4 unicast
   route-target import 65000:10
ip route 0.0.0.0/0 198.51.100.1
ssh server enable
snmp-server enable
ntp server 192.0.2.100
ip dns server-address 192.0.2.53
logging 192.0.2.200
vsx
router ospfv3 1
