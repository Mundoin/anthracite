!
hostname diag-hyg-004-ntp-no-server
!
ip ssh version 2
!
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
!
! NTP service configured (source-interface only) but no server line —
! DIAG-HYG-001 should NOT fire (NTP service present); DIAG-HYG-004
! should fire because the server list is empty.
ntp source Loopback0
!
ip name-server 8.8.8.8
ip domain-name example.test
logging host 10.0.0.99
snmp-server community CompanyX-RO RO
!
line vty 0 4
 exec-timeout 5 0
 transport input ssh
 login local
!
end
