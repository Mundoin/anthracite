[package]
name = "anthracite"
version = "0.1.0"
description = "Anthracite — living network intelligence cockpit."
authors = ["Bujar Shaqiri <bshaqiri@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "anthracite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
